# ============================================================================
# CLIENT MANIFEST — vul dit als eerste in bij een nieuwe klant.
# ============================================================================
# Dit bestand is de bron voor het scaffolden: `docs/NEW-CLIENT.md` beschrijft
# stap voor stap welke placeholders in de repo uit welk veld hieronder komen.
# Businesslogica (beleidsregels, tone-of-voice) hoort NIET hier — die leeft in
# de database en de cockpit, want die verschilt per klant en verandert continu.
#
# Alles met <...> is nog in te vullen.
# ============================================================================

client:
  # Kleine letters, cijfers en streepjes. Landt in de Worker- en Workflow-namen
  # in beide wrangler-configs.
  slug: "factum-webshop"
  # Naam zoals de agent 'm tegen eindklanten mag noemen. Vult de
  # {{client}}-placeholder in de specialist-prompts.
  name: "Factum Webshop"
  # Datalocatie. 'eu' tenzij expliciet anders afgesproken.
  residency: "eu"
  # FactumAI org-id (cuid) — invullen ná het aanmaken van de tenant.
  org_id: "<cuid>"
  # Org-id van het test-tenant (staging). Leeg laten tot je 'm aanmaakt.
  test_org_id: ""

# ---------------------------------------------------------------------------
# Product-herkomst — het contract met het FactumAI-dashboard.
#
# Hiermee beschrijft deze repo zichzelf: welk product het is, op welk fundament
# hij meelift, en of hij updates hoort te krijgen. Het dashboard leest dit blok
# om bij te houden wie welk fundament gebruikt en om de git-flow te bewaken.
# Zie docs/DASHBOARD-INTEGRATION.md. Verander de sleutelnamen niet zonder het
# dashboard mee te nemen.
# ---------------------------------------------------------------------------
product:
  # 'product'  = leunt op een fundament en hoort kernverbeteringen te krijgen.
  # 'maatwerk' = eenmalig bouwsel voor deze klant; géén fundament, geen sync.
  #              Zet dan `kind` en `fundament` op "" en verwijder de
  #              upstream-sync-workflow uit deze repo.
  tier: "product"
  # Welk FactumAI-product: mail | chat | ... Eén woord, stabiel.
  kind: "mail"
  # De fundament-repo waar deze klant op meelift (owner/repo).
  fundament: "Sjaakmatt/mail-agent-fundament"
  # Repo van deze klant zelf (owner/repo) — zodat het dashboard 'm terugvindt.
  # Wijkt af van de <slug>-mail-agent-conventie: dit is de demo-repo, niet een
  # echte klant.
  repo: "Sjaakmatt/chat-mailagent-demo"

# Welke domein-MCP's deze agent mag aanroepen. Laat weg wat de klant niet heeft:
# een ontbrekende MCP is geen fout, de agent valt fail-soft terug (CLAUDE.md).
tools:
  - domain: "mail"
    vendor: "outlook"
    mcp: "internal-mcp-mail"
    auth: "oauth"
    credentials_in_vault: true
  # Bewust géén ERP-MCP: de demo doet order- en voorraad-lookups rechtstreeks op
  # de demo_*-tabellen uit migrations/0005. Sluit je een echte klant aan, zet de
  # ERP-MCP hieronder aan en laat 0005 weg.
  # - domain: "erp"
  #   vendor: "<snelstart|woocommerce|exact|...>"
  #   mcp: "internal-mcp-erp"
  #   auth: "oauth"
  #   credentials_in_vault: true
  # - domain: "crm"
  #   vendor: "<...>"
  #   mcp: "internal-mcp-crm"
  #   auth: "bearer"
  #   credentials_in_vault: true

use_cases:
  - name: "Klantenservicemail beantwoorden"
    description: >
      Binnen komt een mail van een webshopklant over levering, retour, garantie
      of facturatie. Eruit komt een conceptantwoord in de werkbak, met de feiten
      uit een order-lookup erbij. Een mens keurt goed vóór verzending.
  - name: "Chat op de site"
    description: >
      Binnen komt een bericht van een bezoeker via de chatwidget. Kennis- en
      statusvragen worden direct beantwoord; alles wat een actie vraagt wordt een
      ticket en gaat langs de werkbak. Feiten komen uit dezelfde order-lookup.

first_workflow:
  trigger: "mail.received"
  produces: "draft_email"
  # REVIEW = elke uitgaande actie langs een mens. Dit is de default en de
  # harde regel; AUTO alleen na expliciete afspraak met de klant.
  autonomy: "REVIEW"

ui:
  werkbak: true # ReviewItem-werkbak (approve/edit/reject)
  demo: true # demo-pagina aanzetten (DEMO_MODE=true op de cockpit-Worker)

# Categorie-taxonomie: de slugs waarop de classifier kiest en het beleid matcht.
# De code-versie staat in `packages/agent-core/src/taxonomy/index.ts` — houd die
# twee gelijk. Begin met de startset en snoei/hernoem op basis van discovery.
taxonomy:
  source: "packages/agent-core/src/taxonomy/index.ts"
  reviewed_with_client: false

rag:
  enabled: false # aan = pgvector-memory + few-shot; vereist VOYAGE_API_KEY
  sources:
    - "tone-of-voice / huisstijl (GLOBAL, pinned)"
    - "klanthistorie (CLIENT)"
    - "SOP's per proces (PROCESS)"

multi_agent:
  # false = één OrchestrationWorkflow. true = Router → Specialist(en) →
  # Aggregator. Begin op false; zet 'm aan als de mail echt meerdere
  # onderwerpen tegelijk bevat.
  enabled: false

# Klant-eigen domeinmodule (magazijn, planning, ticketing…). Leeg = alleen mail.
# Zie `examples/warehouse-module/` voor een werkende referentie.
domain_modules: []

notes: >
  Dit is de demo-repo, niet een echte klant: de eerste scaffold uit het
  fundament, bedoeld om aan prospects te laten zien en om het scaffold-pad zelf
  uit te proberen. Alle data is verzonnen (example.com) en moet dat blijven.

  De taxonomie en de domeingrens staan bewust nog op de neutrale
  webshop-startset uit het fundament — voor een echte klant is dat stap 4 en 4b
  uit docs/NEW-CLIENT.md, en die begint met discovery.

  Twee kanalen staan aan: mail en chat. `product.kind` blijft "mail" omdat chat
  in dit fundament een tweede kanaal op dezelfde agent is, geen apart product.
  Bij chat gaan `kennis` en `systeem` zónder mens naar de bezoeker
  (mayRespondWithoutHuman); draai daarom `pnpm gate` tegen een echt model
  voordat de widget publiek staat.

  Nog open: org_id en test_org_id, in te vullen zodra het tenant in het
  FactumAI-dashboard bestaat (stap 3b). Zolang __CLIENT_ORG_ID__ in de
  wrangler-configs staat, weigert de deploy-workflow — dat is de bedoeling.
