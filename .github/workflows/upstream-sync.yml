name: Upstream-sync

# Haalt kernverbeteringen uit het mail-agent-fundament op. Draait in een
# KLANT-repo; in het fundament zelf slaat hij zichzelf over.
#
# Twee uitkomsten, en het verschil zit 'm in jouw maatwerk:
#
#   schoon te mergen + tests groen  → merge naar main, en Deploy start.
#   conflict of rode tests          → PR, main blijft ongemoeid.
#
# Een conflict betekent dat het fundament een bestand raakte dat jij voor deze
# klant hebt aangepast (taxonomie, branding, wrangler-config). Dat is precies
# het moment waarop een mens moet kijken — daarom nooit automatisch.
#
# Benodigd in de klant-repo:
#   variable FUNDAMENT_REPO        bv. "Sjaakmatt/mail-agent-fundament"
#   secret   FUNDAMENT_DEPLOY_KEY  privé-helft van een read-only deploy key
#                                  op het fundament (die verloopt niet)
# Ontbreekt er een? Dan slaat de workflow schoon over, hij faalt niet.
# Aanmaken: zie docs/NEW-CLIENT.md, sectie "Fundament-updates ophalen".

on:
  schedule:
    # Vangnet. De normale route is `workflow_dispatch` vanuit het fundament
    # (notify-clients.yml) zodra daar iets op main landt — dan sta je niet tot
    # maandag stil. Deze cron vangt op wat dat aanstoten miste: een verlopen
    # token, een hernoemde repo, een klant die nog niet in CLIENT_REPOS staat.
    # Weghalen kan pas als je erop durft te vertrouwen dat je dat altijd merkt.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write # om Deploy te kunnen starten na een geslaagde merge

jobs:
  sync:
    name: fundament ophalen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Voorwaarden
        id: pre
        env:
          FUNDAMENT_REPO: ${{ vars.FUNDAMENT_REPO }}
          FUNDAMENT_DEPLOY_KEY: ${{ secrets.FUNDAMENT_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          skip() { echo "::notice::$1"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # In het fundament zelf is er geen upstream om op te halen.
          if grep -q '__CLIENT_SLUG__' agents/mail-agent/wrangler.jsonc 2>/dev/null; then
            skip "Dit is het fundament zelf — niets op te halen."
          fi
          [ -n "$FUNDAMENT_REPO" ] \
            || skip "Variable FUNDAMENT_REPO niet gezet — sync overgeslagen (zie docs/NEW-CLIENT.md)."
          [ -n "$FUNDAMENT_DEPLOY_KEY" ] \
            || skip "Secret FUNDAMENT_DEPLOY_KEY niet gezet — sync overgeslagen (zie docs/NEW-CLIENT.md)."

          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Upstream ophalen
        id: fetch
        if: steps.pre.outputs.run == 'true'
        env:
          FUNDAMENT_REPO: ${{ vars.FUNDAMENT_REPO }}
          FUNDAMENT_DEPLOY_KEY: ${{ secrets.FUNDAMENT_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          # Deploy key klaarzetten. Read-only en zonder vervaldatum, dus dit is
          # eenmalig werk per klant-repo — geen jaarlijkse rotatie.
          mkdir -p ~/.ssh
          printf '%s\n' "$FUNDAMENT_DEPLOY_KEY" > ~/.ssh/fundament
          chmod 600 ~/.ssh/fundament
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          # IdentitiesOnly voorkomt dat ssh eerst andere sleutels probeert.
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/fundament -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/fundament -o IdentitiesOnly=yes"

          git remote add upstream "git@github.com:${FUNDAMENT_REPO}.git"
          git fetch --quiet upstream main

          ahead=$(git rev-list --count HEAD..upstream/main)
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          if [ "$ahead" -eq 0 ]; then
            echo "::notice::Al bij met het fundament."
            exit 0
          fi

          echo "Nieuw in het fundament ($ahead commits):"
          git log --oneline HEAD..upstream/main | tee /tmp/nieuw.txt

          # Raakt de update workflow-bestanden? Dan kan deze workflow 'm niet
          # landen, en ook geen PR-branch pushen.
          #
          # De GITHUB_TOKEN van Actions mag geen bestanden onder
          # .github/workflows/ schrijven. Dat is een platformregel en geen
          # instelling: je krijgt "refusing to allow a GitHub App to create or
          # update workflow ... without `workflows` permission", op élke push
          # die zulke bestanden bevat — dus ook op de branch achter de PR.
          #
          # Vooraf vaststellen in plaats van halverwege stukgaan. Anders draait
          # de hele verificatie, lukt de merge lokaal, en faalt pas de push —
          # met een foutmelding die niet vertelt wat je moet doen.
          workflows=$(git diff --name-only HEAD..upstream/main -- .github/workflows/ | tr '\n' ' ')
          echo "workflows=$workflows" >> "$GITHUB_OUTPUT"
          if [ -n "$workflows" ]; then
            echo "::warning::Deze fundament-update wijzigt workflow-bestanden ($workflows). Actions mag die niet pushen; haal 'm met de hand op — zie de samenvatting."
            {
              echo "### Fundament-update vraagt om een mens"
              echo
              echo "Deze update raakt \`.github/workflows/\`:"
              echo
              for f in $workflows; do echo "- \`$f\`"; done
              echo
              echo "De \`GITHUB_TOKEN\` van Actions mag workflow-bestanden niet schrijven."
              echo "Dat geldt ook voor de PR-route, want die pusht dezelfde bestanden."
              echo
              echo "Haal 'm lokaal op:"
              echo
              echo '```bash'
              echo "git fetch upstream && git merge upstream/main"
              echo "pnpm install && pnpm -r typecheck && pnpm -r test"
              echo "git push"
              echo '```'
              echo
              echo "Liever automatisch? Dan heeft deze repo een token met"
              echo "**Workflows: write** nodig, en moet de push hieronder dat token"
              echo "gebruiken in plaats van GITHUB_TOKEN. Dat is een bewuste"
              echo "rechtenkeuze: zo'n token mag de CI van deze repo herschrijven."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Raakt de update workflow-bestanden, dan slaat alles hierna over: geen
      # merge, geen PR, geen deploy. De waarschuwing en de samenvatting
      # hierboven zijn dan de hele uitkomst.
      #
      # Eén conditie volstaat: valt deze stap weg, dan is `merge.outputs.clean`
      # leeg en `verify.outcome` "skipped", waardoor ook de merge-, deploy- en
      # PR-stappen hieronder niet aanslaan.
      - name: Proefmerge
        id: merge
        if: |
          steps.pre.outputs.run == 'true'
          && steps.fetch.outputs.ahead != '0'
          && steps.fetch.outputs.workflows == ''
        run: |
          set -uo pipefail
          git config user.name "upstream-sync"
          git config user.email "actions@github.com"

          # Op een wegwerpbranch proberen, zodat main onaangeraakt blijft
          # zolang we niet zeker weten dat het goed gaat.
          git checkout -q -b sync-probe
          if git merge --no-edit upstream/main > /tmp/merge.log 2>&1; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            echo "Schoon te mergen."
          else
            conflicts=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            git merge --abort || true
            echo "clean=false" >> "$GITHUB_OUTPUT"
            echo "conflicts=$conflicts" >> "$GITHUB_OUTPUT"
            echo "::warning::Conflict met klant-maatwerk in: $conflicts"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.merge.outputs.clean == 'true'
      - uses: actions/setup-node@v4
        if: steps.merge.outputs.clean == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Verifiëren
        id: verify
        if: steps.merge.outputs.clean == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm -r typecheck
          pnpm -r test
          pnpm --filter @factumai/aios-cockpit build

      # ---------------------------------------------------------------------
      # Groen licht: naar main. Een push met GITHUB_TOKEN start géén andere
      # workflows (recursiebeveiliging), dus Deploy starten we expliciet.
      # ---------------------------------------------------------------------
      - name: Mergen naar main
        id: land
        if: steps.merge.outputs.clean == 'true' && steps.verify.outcome == 'success'
        run: |
          set -euo pipefail
          git checkout -q main

          # Main kan zijn verschoven terwijl wij aan het verifiëren waren — een
          # mens die zelf mergede, of een tweede run. Zonder deze controle
          # pusht deze stap een tip die achterloopt, krijgt "non-fast-forward"
          # terug, en faalt de hele workflow rood terwijl er niets mis is.
          #
          # Een rode workflow die je moet leren negeren is erger dan geen
          # workflow: de volgende keer dat hij rood staat kijkt niemand meer.
          git fetch --quiet origin main

          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "::notice::Main bevat deze fundament-update al (iemand was ons voor). Niets te doen."
            exit 0
          fi

          if [ "$(git rev-parse origin/main)" != "$(git rev-parse main)" ]; then
            # Main is om een ándere reden verschoven. Dan is onze verificatie op
            # de oude basis gedraaid en zegt hij niets meer over wat er nu zou
            # landen. Niet alsnog pushen: de volgende run doet het opnieuw,
            # mét verificatie op de juiste basis.
            echo "::notice::Main is verschoven tijdens de verificatie. Deze run landt niets; de volgende pakt 'm op vanaf de nieuwe basis."
            exit 0
          fi

          git merge --ff-only sync-probe
          git push origin main
          echo "::notice::Fundament-update gemerged naar main."
          echo "landed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy starten
        if: steps.land.outputs.landed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
            });
            core.notice('Deploy gestart voor de gemergede fundament-update.');

      # ---------------------------------------------------------------------
      # Niet vanzelf te landen → PR, zodat een mens ernaar kijkt. De PR gaat
      # uit van upstream/main naar main: GitHub toont dan precies de nieuwe
      # fundament-commits, en markeert de conflicten met jouw maatwerk.
      # ---------------------------------------------------------------------
      - name: PR openen
        if: |
          steps.fetch.outputs.ahead != '0'
          && (steps.merge.outputs.clean == 'false' || steps.verify.outcome == 'failure')
        run: |
          set -euo pipefail
          # Naar origin, met het automatische GITHUB_TOKEN — de deploy key is
          # read-only en mag hier dus niets mee.
          unset GIT_SSH_COMMAND
          git push --force origin refs/remotes/upstream/main:refs/heads/upstream-sync
          echo "branch upstream-sync bijgewerkt"

      - name: PR aanmaken of bijwerken
        if: |
          steps.fetch.outputs.ahead != '0'
          && (steps.merge.outputs.clean == 'false' || steps.verify.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const commits = fs.existsSync('/tmp/nieuw.txt')
              ? fs.readFileSync('/tmp/nieuw.txt', 'utf8').trim()
              : '(onbekend)';
            const conflicts = `${{ steps.merge.outputs.conflicts }}`.trim();
            const clean = `${{ steps.merge.outputs.clean }}` === 'true';

            const reden = clean
              ? 'De merge is schoon, maar **typecheck, tests of de cockpit-build faalt** ' +
                'erna. Waarschijnlijk sluit een kernwijziging niet aan op het maatwerk ' +
                'van deze klant.'
              : 'De merge **conflicteert met maatwerk** van deze klant in:\n\n' +
                conflicts.split(/\s+/).filter(Boolean).map(f => `- \`${f}\``).join('\n');

            const body = [
              '## Fundament-update',
              '',
              'Deze klant loopt achter op het mail-agent-fundament. Automatisch mergen',
              'is hier niet veilig, dus dit is blijven staan voor een mens.',
              '',
              '### Waarom geen automatische merge',
              '',
              reden,
              '',
              '### Nieuw in het fundament',
              '',
              '```',
              commits,
              '```',
              '',
              '### Lokaal oplossen',
              '',
              '```bash',
              'git fetch upstream',
              'git merge upstream/main',
              '# conflicten oplossen — bij twijfel wint de klant-versie',
              'pnpm install && pnpm -r typecheck && pnpm -r test',
              'git push',
              '```',
              '',
              'Blijkt bij het oplossen dat het maatwerk eigenlijk in de kern hoort?',
              'Breng het dan terug naar het fundament in plaats van het hier te houden.',
            ].join('\n');

            const {owner, repo} = context.repo;
            const open = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:upstream-sync`,
            });

            if (open.data.length > 0) {
              await github.rest.pulls.update({
                owner, repo, pull_number: open.data[0].number, body,
              });
              core.notice(`PR #${open.data[0].number} bijgewerkt.`);
            } else {
              const pr = await github.rest.pulls.create({
                owner, repo,
                title: 'Fundament-update ophalen',
                head: 'upstream-sync',
                base: 'main',
                body,
              });
              core.notice(`PR #${pr.data.number} geopend.`);
            }
